<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Kchel Dialer — "Forward K". A dark tile keeps the mark legible against
       both light and dark browser chrome; the mark alone would disappear
       against a dark tab strip. Colours are literal because a standalone
       favicon cannot read the app's CSS tokens. -->
  <rect width="64" height="64" rx="14" fill="#16181D"/>
  <g transform="translate(32 32) scale(0.82) translate(-32 -32)">
    <rect x="10" y="12" width="9" height="40" rx="4.5" fill="#14B26A"/>
    <path d="M25 15 L41 32 L25 49" fill="none" stroke="#3D79EE" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M43 22 L53 32 L43 42" fill="none" stroke="#F0C020" stroke-width="8"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
