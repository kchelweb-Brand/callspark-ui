<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>Kchel Dialer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <section id="screen-login" class="screen">
    <div class="brand">
      <svg viewBox="0 0 64 64" width="28" height="28" fill="none" aria-hidden="true">
        <rect x="10" y="12" width="9" height="40" rx="4.5" fill="var(--brand-green)" />
        <path d="M25 15 L41 32 L25 49" stroke="var(--brand-blue)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M43 22 L53 32 L43 42" stroke="var(--brand-yellow)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      Kchel Dialer
    </div>

    <form id="form-request-code" class="stack">
      <label>Workspace
        <input id="input-slug" type="text" placeholder="akinbinu" autocomplete="off" required />
      </label>
      <label>Email
        <input id="input-email" type="email" placeholder="you@company.com" autocomplete="email" required />
      </label>
      <button type="submit">Send code</button>
      <p class="hint" id="login-hint"></p>
    </form>

    <form id="form-verify-code" class="stack hidden">
      <p class="hint">Enter the code sent to your email.</p>
      <input id="input-code" type="text" inputmode="numeric" placeholder="000000" autocomplete="one-time-code" required />
      <button type="submit">Sign in</button>
      <p class="hint" id="verify-hint"></p>
    </form>
  </section>

  <section id="screen-app" class="screen app-shell hidden">
    <nav class="sidebar">
      <div class="brand-small">
        <svg viewBox="0 0 64 64" width="20" height="20" fill="none" aria-hidden="true">
          <rect x="10" y="12" width="9" height="40" rx="4.5" fill="var(--brand-green)" />
          <path d="M25 15 L41 32 L25 49" stroke="var(--brand-blue)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M43 22 L53 32 L43 42" stroke="var(--brand-yellow)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Kchel Dialer
      </div>
      <button class="nav-item active" data-view="dialer">Dialer</button>
      <button class="nav-item" data-view="sip-config">SIP Configuration</button>
      <button class="nav-item" data-view="contacts">Contacts</button>
      <button class="nav-item" data-view="campaigns">Campaigns</button>
      <button class="nav-item" data-view="ivr">IVR</button>
      <button class="nav-item" data-view="settings">Settings</button>
      <div class="sidebar-footer">
        <span id="reg-status" class="status status-pending">Connecting…</span>
        <button id="btn-logout" class="link">Sign out</button>
      </div>
    </nav>

    <main class="main-area">
      <section id="view-dialer" class="view">
        <div id="call-panel" class="call-panel hidden">
          <div class="call-number" id="call-number">—</div>
          <div class="call-state" id="call-state">Calling…</div>
          <div class="call-timer" id="call-timer"></div>
          <div class="call-actions">
            <button id="btn-accept" class="call-btn accept hidden">Accept</button>
            <button id="btn-hangup" class="call-btn hangup">Hang up</button>
          </div>
          <div class="dtmf-row hidden" id="dtmf-row">
            <button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button>
            <button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button>
            <button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button>
            <button data-digit="*">*</button><button data-digit="0">0</button><button data-digit="#">#</button>
          </div>
        </div>

        <div id="dial-panel" class="dial-panel">
          <div class="number-display">
            <p class="number-display-label">Enter a number</p>
            <p class="number-display-value" id="number-display">—</p>
          </div>

          <div class="keypad" id="keypad">
            <button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button>
            <button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button>
            <button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button>
            <button data-digit="*">*</button><button data-digit="0">0</button><button data-digit="#">#</button>
          </div>

          <div class="dial-actions">
            <button id="btn-dial" class="round-btn call" aria-label="Call">&#9742;</button>
            <button id="btn-backspace" class="round-btn erase" aria-label="Backspace">&larr;</button>
          </div>

          <p class="hint" id="dialer-hint"></p>

          <div class="recents">
            <p class="recents-label">Recent</p>
            <div id="recents-list"></div>
          </div>
        </div>
      </section>

      <section id="view-sip-config" class="view hidden">
        <h1 class="page-title">SIP Configuration</h1>
        <div class="panel" id="sip-status-panel"></div>
        <form id="form-sip" class="stack panel">
          <label>Label
            <input id="sip-label" type="text" placeholder="My SIP trunk" />
          </label>
          <label>SIP username
            <input id="sip-username" type="text" required />
          </label>
          <label>SIP password <span class="hint-inline">(leave blank to keep the saved one)</span>
            <input id="sip-password" type="password" />
          </label>
          <label>Transport
            <select id="sip-transport">
              <option value="wss">WSS</option>
              <option value="tls">TLS</option>
              <option value="tcp">TCP</option>
              <option value="udp">UDP</option>
            </select>
          </label>
          <label>SIP host <span class="hint-inline">(for TLS/TCP/UDP)</span>
            <input id="sip-host" type="text" placeholder="sip.yourprovider.com" />
          </label>
          <label>WSS URL <span class="hint-inline">(for WSS)</span>
            <input id="sip-wss-url" type="text" placeholder="wss://sip.yourprovider.com:443" />
          </label>
          <label>Port <span class="hint-inline">(optional)</span>
            <input id="sip-port" type="number" />
          </label>
          <label>Realm <span class="hint-inline">(optional)</span>
            <input id="sip-realm" type="text" />
          </label>
          <button type="submit">Save connection</button>
          <p class="hint" id="sip-hint"></p>
        </form>
      </section>

      <section id="view-contacts" class="view hidden">
        <div class="page-header">
          <h1 class="page-title">Contacts</h1>
          <div class="page-actions">
            <input id="contacts-search" type="text" placeholder="Search contacts…" />
            <label class="file-btn">Import CSV<input id="contacts-csv-input" type="file" accept=".csv" hidden /></label>
          </div>
        </div>
        <p class="hint" id="contacts-hint"></p>
        <div class="panel" id="contacts-table"></div>
      </section>

      <section id="view-campaigns" class="view hidden">
        <div class="page-header">
          <h1 class="page-title">Campaigns</h1>
          <button id="btn-new-campaign">New campaign</button>
        </div>
        <div class="panel" id="campaigns-table"></div>
      </section>

      <section id="view-ivr" class="view hidden">
        <div class="page-header">
          <h1 class="page-title">IVR menus</h1>
          <button id="btn-new-ivr-menu">New menu</button>
        </div>
        <p class="hint" id="ivr-hint"></p>
        <div id="ivr-menus"></div>
      </section>

      <section id="view-settings" class="view hidden">
        <h1 class="page-title">Settings</h1>
        <form id="form-settings" class="stack panel">
          <label>Company name
            <input id="settings-company" type="text" />
          </label>
          <label>Business phone
            <input id="settings-phone" type="text" />
          </label>
          <div class="checkbox-row"><input id="settings-pref-record" type="checkbox" /><label for="settings-pref-record">Record all inbound calls</label></div>
          <div class="checkbox-row"><input id="settings-pref-transcribe" type="checkbox" /><label for="settings-pref-transcribe">Voicemail transcription</label></div>
          <div class="checkbox-row"><input id="settings-pref-coach" type="checkbox" /><label for="settings-pref-coach">Whisper coaching for supervisors</label></div>
          <button type="submit">Save settings</button>
          <p class="hint" id="settings-hint"></p>
        </form>
      </section>
    </main>
  </section>

  <div id="modal-root"></div>

  <script src="renderer.js"></script>
  <script src="sip-config.js"></script>
  <script src="contacts.js"></script>
  <script src="campaigns.js"></script>
  <script src="ivr.js"></script>
  <script src="settings.js"></script>
</body>
</html>
